# Example Nginx configuration for a service protected by RAuth
# This file shows how to use the 'auth_request' module to secure any backend.
#
# CLIENT IP / TRUST NOTES
# -----------------------
# rauth's only peer is THIS proxy (e.g. the Docker bridge 172.x.x.x), so the
# real client IP can only reach rauth via a header nginx sets. To make rauth
# log and act on it, set the matching trust flag on the rauth container:
#
#   * nginx is the only proxy:   TRUST_X_REAL_IP=true   (or TRUST_X_FORWARDED_FOR=true)
#   * Cloudflare ONLY in front:  TRUST_CLOUDFLARE_IP=true
#
# With no TRUST_* flag set, rauth uses "smart mode": it only adopts a forwarded
# IP when the immediate peer is private AND the forwarded IP is public. That
# means a private LAN client (192.168.x / 10.x) is rejected and rauth falls
# back to the proxy's own address -- which is why you may "only see the Docker
# IP". Enabling TRUST_X_REAL_IP fixes this because nginx overwrites X-Real-IP
# with $remote_addr (a client cannot spoof it through nginx).
#
# MIXED ACCESS (Cloudflare AND direct LAN/Tailscale bypassing Cloudflare)
# -----------------------------------------------------------------------
# Do NOT use TRUST_CLOUDFLARE_IP here: rauth cannot tell a Cloudflare request
# from a direct one (its peer is always nginx), so a direct client could spoof
# CF-Connecting-IP. Instead let nginx resolve the true client and forward it as
# X-Real-IP for every path, then set TRUST_X_REAL_IP=true on rauth.
#
# Add nginx's realip module, scoped to Cloudflare's ranges ONLY, so direct
# LAN/Tailscale connections keep their real $remote_addr while Cloudflare
# traffic is rewritten to the visitor IP. Keep the list current from
# https://www.cloudflare.com/ips/ :
#
#   set_real_ip_from 173.245.48.0/20;
#   set_real_ip_from 103.21.244.0/22;
#   set_real_ip_from 103.22.200.0/22;
#   set_real_ip_from 103.31.4.0/22;
#   set_real_ip_from 141.101.64.0/18;
#   set_real_ip_from 108.162.192.0/18;
#   set_real_ip_from 190.93.240.0/20;
#   set_real_ip_from 188.114.96.0/20;
#   set_real_ip_from 197.234.240.0/22;
#   set_real_ip_from 198.41.128.0/17;
#   set_real_ip_from 162.158.0.0/15;
#   set_real_ip_from 104.16.0.0/13;
#   set_real_ip_from 104.24.0.0/14;
#   set_real_ip_from 172.64.0.0/13;
#   set_real_ip_from 131.0.72.0/22;
#   set_real_ip_from 2400:cb00::/32;
#   set_real_ip_from 2606:4700::/32;
#   set_real_ip_from 2803:f800::/32;
#   set_real_ip_from 2405:b500::/32;
#   set_real_ip_from 2405:8100::/32;
#   set_real_ip_from 2a06:98c0::/29;
#   set_real_ip_from 2c0f:f248::/32;
#   real_ip_header CF-Connecting-IP;
#   real_ip_recursive on;
#
# After this, X-Real-IP ($remote_addr) carries the genuine visitor on every
# path. If nginx itself sits behind a NON-Cloudflare proxy/LB instead, point
# real_ip_header at X-Forwarded-For and set_real_ip_from to that proxy's range.

server {
    listen 80;
    server_name myapp.yourdomain.com;

    # 1. Main location block for your application
    location / {
        # This tells Nginx to check with RAuth before allowing the request
        auth_request /rauth-verify;

        # Propagate the session refresh cookie if RAuth provides one
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;

        # Capture the authenticated user from RAuth headers
        auth_request_set $auth_user $upstream_http_x_rauth_user;
        auth_request_set $auth_groups $upstream_http_x_rauth_groups;
        auth_request_set $auth_admin $upstream_http_x_rauth_admin;
        
        proxy_set_header X-Remote-User $auth_user;
        proxy_set_header X-Remote-Groups $auth_groups;
        proxy_set_header X-Remote-Admin $auth_admin;

        # If RAuth returns 401 (Unauthorized), redirect the user to the login page
        error_page 401 = @error401;

        # Normal proxy configuration for your app
        proxy_pass http://your_backend_service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Internal endpoint used by Nginx to communicate with RAuth
    location = /rauth-verify {
        internal;
        # Use the internal Docker service name or the public URL of your RAuth instance
        proxy_pass http://rauth-app:80/rauthvalidate;

        # Don't send the original request body to the auth service
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        
        # Pass the original URL and the real client IP for validation/logging.
        # Both X-Real-IP and X-Forwarded-For are forwarded so rauth can resolve
        # the client IP regardless of which TRUST_* mode is enabled. Without
        # these, rauth only sees nginx's address (e.g. the Docker bridge
        # 172.x.x.x) on the auth subrequest.
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Pass cookies (where the auth token is stored)
        proxy_set_header Cookie $http_cookie;
    }

    # 3. Redirect to the RAuth login page when the user is not authenticated
    location @error401 {
        # Redirect to the RAuth login page with the current URL as the return path
        # Ensure 'auth.yourdomain.com' is replaced with your actual RAuth domain
        # It is highly recommended to use HTTPS for RAuth.
        return 302 https://auth.yourdomain.com/rauthlogin?rd=$scheme://$http_host$request_uri;
    }
}
