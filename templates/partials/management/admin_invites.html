{{/* Invitation link generator. */}}
{{define "admin_invites"}}
<section data-panel="invites" data-title="Invitations" hidden>
    <div class="panel" style="max-width: 760px;">
        <div class="panel-header">
            <div>
                <h2>Invite a user</h2>
                <div class="sub">The recipient chooses their own username and password when they redeem the link.</div>
            </div>
        </div>
        <div class="panel-body">
            <form id="inviteForm" class="row g-3 align-items-end">
                <input type="hidden" name="csrf" value="{{.csrf}}">
                <div class="col-sm-8">
                    <label class="form-label" for="inviteEmail">Recipient email</label>
                    <input type="email" name="email" id="inviteEmail" class="form-control" placeholder="user@example.com" required>
                </div>
                <div class="col-sm-4">
                    <button type="submit" class="btn btn-primary w-100" id="inviteSubmit"><i class="bi bi-link-45deg me-1"></i>Create link</button>
                </div>
            </form>

            <div id="inviteResult" class="mt-4" hidden>
                <div class="callout ok mb-3">
                    <i class="bi bi-check-circle-fill"></i>
                    <div>Invitation created for <strong id="inviteFor"></strong>. Send this link to them; it works once and expires in 24 hours.</div>
                </div>
                <div class="input-group">
                    <input type="text" id="inviteUrl" class="form-control mono" readonly aria-label="Invitation link">
                    <button class="btn btn-secondary" type="button" data-copy="#inviteUrl"><i class="bi bi-clipboard me-1"></i>Copy</button>
                </div>
            </div>
        </div>
    </div>
</section>
{{end}}
