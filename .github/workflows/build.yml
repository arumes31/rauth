name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitleaksignore'
      - 'docker-compose*.yml'
      - 'nginx-proxy-example.conf'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitleaksignore'
      - 'docker-compose*.yml'
      - 'nginx-proxy-example.conf'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go for asset minification
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Minify JavaScript assets
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' js_files < <(
            find static/js -type f -name '*.js' ! -name '*.min.js' -print0
          )
          if (( ${#js_files[@]} == 0 )); then
            echo '::error::No non-minified JavaScript assets were found.'
            exit 1
          fi

          before_bytes=0
          for file in "${js_files[@]}"; do
            before_bytes=$((before_bytes + $(wc -c < "$file")))
          done

          go run github.com/tdewolff/minify/v2/cmd/minify@v2.24.17 \
            --inplace "${js_files[@]}"

          after_bytes=0
          for file in "${js_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Minification produced an empty asset."
              exit 1
            fi
            after_bytes=$((after_bytes + $(wc -c < "$file")))
          done

          if (( after_bytes > before_bytes )); then
            echo "::error::Minified assets grew from $before_bytes to $after_bytes bytes."
            exit 1
          fi
          echo "Minified ${#js_files[@]} JavaScript asset(s): $before_bytes -> $after_bytes bytes."

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Auth Service
        id: meta-auth
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/rauth-auth
          # No implicit :latest (metadata-action adds one for semver tags by
          # default, e.g. a manual dispatch on a v* tag); only the rule below.
          flavor: |
            latest=false
          tags: |
            # Only the default branch may move :latest, which deployments pull;
            # a manual dispatch on another branch gets just its branch/sha tags.
            type=raw,value=latest,enable={{is_default_branch}}
            # Branch tags of other branches carry a prefix, so a branch named
            # "latest" or "stable" cannot publish over those deployment tags.
            type=ref,event=branch,enable={{is_default_branch}}
            type=ref,event=branch,prefix=branch-,enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and push Auth Service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-auth.outputs.tags }}
          labels: ${{ steps.meta-auth.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
