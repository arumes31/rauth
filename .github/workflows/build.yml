name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check dependency metadata
        run: go mod tidy -diff

      - name: Verify dependencies
        run: go mod verify

      - name: Run Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race -coverprofile=coverage.txt ./...

  build:
    name: Build and Push
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go for asset minification
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Minify JavaScript assets
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' js_files < <(
            find static/js -type f -name '*.js' ! -name '*.min.js' -print0
          )
          if (( ${#js_files[@]} == 0 )); then
            echo '::error::No non-minified JavaScript assets were found.'
            exit 1
          fi

          before_bytes=0
          for file in "${js_files[@]}"; do
            before_bytes=$((before_bytes + $(wc -c < "$file")))
          done

          go run github.com/tdewolff/minify/v2/cmd/minify@v2.24.17 \
            --inplace "${js_files[@]}"

          after_bytes=0
          for file in "${js_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Minification produced an empty asset."
              exit 1
            fi
            after_bytes=$((after_bytes + $(wc -c < "$file")))
          done

          if (( after_bytes > before_bytes )); then
            echo "::error::Minified assets grew from $before_bytes to $after_bytes bytes."
            exit 1
          fi
          echo "Minified ${#js_files[@]} JavaScript asset(s): $before_bytes -> $after_bytes bytes."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Auth Service
        id: meta-auth
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/rauth-auth
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and push Auth Service
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-auth.outputs.tags }}
          labels: ${{ steps.meta-auth.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
