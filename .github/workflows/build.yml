name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race -coverprofile=coverage.txt ./...

  build:
    name: Build and Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go for asset minification
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Minify JavaScript assets
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' js_files < <(
            find static/js -type f -name '*.js' ! -name '*.min.js' -print0
          )
          if (( ${#js_files[@]} == 0 )); then
            echo '::error::No non-minified JavaScript assets were found.'
            exit 1
          fi

          before_bytes=0
          for file in "${js_files[@]}"; do
            before_bytes=$((before_bytes + $(wc -c < "$file")))
          done

          go run github.com/tdewolff/minify/v2/cmd/minify@v2.24.14 \
            --inplace "${js_files[@]}"

          after_bytes=0
          for file in "${js_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Minification produced an empty asset."
              exit 1
            fi
            after_bytes=$((after_bytes + $(wc -c < "$file")))
          done

          if (( after_bytes > before_bytes )); then
            echo "::error::Minified assets grew from $before_bytes to $after_bytes bytes."
            exit 1
          fi
          echo "Minified ${#js_files[@]} JavaScript asset(s): $before_bytes -> $after_bytes bytes."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Auth Service
        id: meta-auth
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/rauth-auth
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and push Auth Service
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-auth.outputs.tags }}
          labels: ${{ steps.meta-auth.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
