name: Go Tests

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitleaksignore'
      - 'docker-compose*.yml'
      - 'nginx-proxy-example.conf'
  pull_request:
    branches: [ "**" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitleaksignore'
      - 'docker-compose*.yml'
      - 'nginx-proxy-example.conf'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_PASSWORD: test
        volumes:
          - /tmp/rauth-test-pg-${{ github.run_id }}-${{ github.run_attempt }}:/var/lib/postgresql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable verified TLS for disposable PostgreSQL
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: bash .github/scripts/prepare-postgres-tls.sh "$POSTGRES_SERVICE_ID"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check dependency metadata
        run: go mod tidy -diff

      - name: Verify dependencies
        run: go mod verify

      - name: Run frontend regressions
        run: node --test tests/*.test.mjs

      - name: Run Tests
        run: go test -v -race ./...
