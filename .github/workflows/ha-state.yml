name: HA State Fixture

on:
  pull_request:
    paths: ['deploy/ha/state/**', '.github/workflows/ha-state.yml']
  push:
    branches: [main]
    paths: ['deploy/ha/state/**', '.github/workflows/ha-state.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: HA fixture regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hash-locked test dependencies
        run: |
          python3 -m venv /tmp/ha-test
          /tmp/ha-test/bin/pip install --require-hashes --no-deps -r deploy/ha/state/requirements-test.lock
      - run: /tmp/ha-test/bin/python -m unittest discover -s deploy/ha/state -p 'test_*.py' -v
      - name: Verify real etcd gateway TLS and certificate purposes
        run: sudo python3 deploy/ha/state/test_etcd_gateway.py

  image:
    name: HA state image (amd64 and arm64)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise image permissions from private build staging
        run: chmod 0600 deploy/ha/state/entrypoint.py deploy/ha/state/archive.py deploy/ha/state/pki_renew.py deploy/ha/state/backup.py
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/ha/state
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/rauth-postgres:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ha-state
          cache-to: type=gha,mode=max,scope=ha-state
          provenance: mode=max
          sbom: true
