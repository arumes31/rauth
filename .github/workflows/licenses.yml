name: license-audit

permissions:
  contents: read
on:
  push:
    branches: [ main, test ]
    paths:
      - 'go.mod'
      - 'go.sum'
      - '**.go'
      - '.github/workflows/licenses.yml'
  pull_request:
    branches: [ main, test ]
    paths:
      - 'go.mod'
      - 'go.sum'
      - '**.go'
      - '.github/workflows/licenses.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache go-licenses
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/go-licenses
          key: ${{ runner.os }}-go-licenses-v2.0.1-go${{ steps.setup-go.outputs.go-version }}
      - name: Install go-licenses
        run: |
          if ! command -v go-licenses >/dev/null 2>&1; then
            go install github.com/google/go-licenses/v2@v2.0.1
          fi
      - name: Check Licenses
        run: |
          # Fails if any forbidden licenses (GPL, etc) are found
          go-licenses check ./...
      - name: Report Licenses
        run: go-licenses report ./... > licenses_report.csv
      - name: Upload Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-report
          path: licenses_report.csv
